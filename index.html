<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matematică pe tablă – clasa a II-a</title>
<script src="tema.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#f6fbff; --grid:#cfe3f4; --ink:#1d2b4f; --muted:#52638a;
  --panel:#ffffff; --line:#b9cde4; --margin:#e8707a;
  --font:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--paper:#16213a;--grid:#243556;--ink:#eef3ff;--muted:#a9b8d8;--panel:#1e2c4d;--line:#3b4f7a}
}
:root[data-theme="dark"]{--paper:#16213a;--grid:#243556;--ink:#eef3ff;--muted:#a9b8d8;--panel:#1e2c4d;--line:#3b4f7a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100vh;font-family:var(--font);color:var(--ink);background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px;
}
body::before{content:"";position:fixed;left:56px;top:0;bottom:0;width:2px;background:var(--margin);opacity:.55;pointer-events:none}
.wrap{max-width:1100px;margin:0 auto;padding:28px 24px 48px 84px}
@media (max-width:700px){.wrap{padding-left:20px} body::before{display:none}}
header{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:28px}
h1{margin:0;font-size:clamp(34px,5vw,56px);font-weight:800;line-height:1.05}
.sub{margin:6px 0 0;font-size:clamp(18px,2.2vw,24px);color:var(--muted);font-weight:600}
.btn{font:700 18px/1 var(--font);min-height:50px;padding:0 16px;border-radius:12px;border:3px solid var(--ink);background:var(--panel);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;text-decoration:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:20px}
.card{
  display:flex;flex-direction:column;gap:10px;padding:22px 22px 20px;min-height:220px;
  background:var(--panel);border:4px solid var(--ink);border-radius:22px;color:var(--ink);text-decoration:none;
  box-shadow:0 8px 0 rgba(0,0,0,.18);transition:transform .12s,box-shadow .12s;
}
a.card:hover,a.card:focus-visible{transform:translateY(-3px);box-shadow:0 11px 0 rgba(0,0,0,.18)}
a.card:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.ico{font-size:58px;line-height:1}
.card h2{margin:0;font-size:32px;font-weight:800}
.card p{margin:0;font-size:20px;line-height:1.3;color:var(--muted);font-weight:500;flex:1}
.pt{align-self:flex-start;background:var(--ink);color:var(--paper);border-radius:10px;padding:2px 12px;font-size:16px;font-weight:800}
.card.off{border-style:dashed;box-shadow:none;opacity:.6;min-height:0}
.card.off h2{font-size:24px}
.card.off .ico{font-size:34px}
h3{margin:34px 0 12px;font-size:22px;font-weight:800;color:var(--muted)}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.foot{margin-top:30px;font-size:19px;color:var(--muted)}
.foot a{color:var(--ink);font-weight:800}
button:focus-visible,a:focus-visible{outline:4px solid #ffd447;outline-offset:3px}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Matematică pe tablă</h1>
      <p class="sub">Clasa a II-a · instrumente pentru tabla Smart</p>
    </div>
    <button class="btn" id="bTema"></button>
  </header>

  <nav class="grid" id="meniu" aria-label="Pagini"></nav>

  <h3>În pregătire</h3>
  <div class="mini" id="curand"></div>

  <p class="foot" id="foot"></p>
</div>
<script>
/* Adăugați aici paginile noi: apar automat în meniu. */
const PAGINI = [
  { href: "whiteboard.html", ico: "📏", titlu: "Whiteboard", desc: "Desenează explicații cu segmente, linii, acolade și etichete. Pentru explicații la tablă.", pentru: "Învățător" },
  { href: "probleme.html", ico: "🧮", titlu: "Probleme", desc: "Rezolvă probleme pe metode, cu explicații animate și voce.", pentru: "Elevi și învățător" },
  { href: "admin.html", ico: "✏️", titlu: "Administrare", desc: "Creează probleme noi, vezi cum arată și exportă lista.", pentru: "Învățător" }
];
const CURAND = [
  { ico: "📐", titlu: "Axa numerelor și blocuri" },
  { ico: "🕒", titlu: "Ceas și bani" },
  { ico: "🔲", titlu: "Rețea de pătrățele" },
  { ico: "🍕", titlu: "Fracții" }
];
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
document.getElementById("meniu").innerHTML = PAGINI.map(p =>
  `<a class="card" href="${esc(p.href)}"><span class="ico" aria-hidden="true">${p.ico}</span><h2>${esc(p.titlu)}</h2><p>${esc(p.desc)}</p><span class="pt">${esc(p.pentru)}</span></a>`).join("");
document.getElementById("curand").innerHTML = CURAND.map(p =>
  `<div class="card off" aria-disabled="true"><span class="ico" aria-hidden="true">${p.ico}</span><h2>${esc(p.titlu)}</h2></div>`).join("");
try {
  if (localStorage.getItem("matematica.probleme.draft"))
    document.getElementById("foot").innerHTML = `Ai probleme salvate în administrare, care nu sunt încă publicate: <a href="probleme.html#ciorna">vezi-le pe tablă</a>.`;
} catch (e) {}
</script>
</body>
</html>
